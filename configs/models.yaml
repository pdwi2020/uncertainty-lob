deeplob:
  input_channels: 40
  cnn_filters: [32, 64, 64]
  cnn_kernel: 2
  lstm_hidden: 64
  lstm_layers: 2
  dropout: 0.2
  n_classes: 3

tcn:
  input_channels: 40
  num_channels: [64, 64, 64, 64, 64, 64]
  kernel_size: 3
  dropout: 0.2
  n_classes: 3
  dilations: [1, 2, 4, 8, 16, 32]

lob_transformer:
  input_dim: 40
  d_model: 64
  nhead: 4
  num_encoder_layers: 2
  dim_feedforward: 128
  dropout: 0.1
  max_seq_len: 100
  n_classes: 3

neural_cde:
  input_channels: 40
  hidden_channels: 64
  output_channels: 3
  interpolation: cubic
  adjoint: true
  solver: rk4
  rtol: 1.0e-3
  atol: 1.0e-4
  dropout: 0.1

cnn_lstm_attention:
  input_channels: 40
  cnn_filters: [32, 64, 64]
  cnn_kernel: 3
  lstm_hidden: 64
  lstm_layers: 2
  attention_heads: 4
  dropout: 0.2
  n_classes: 3
